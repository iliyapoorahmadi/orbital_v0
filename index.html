<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Orbital | اوربیتال</title>
    <meta name="description" content="پلتفرم آموزشی و رصدخانه دیجیتال اوربیتال؛ تلاقی دانش نجوم باستانی با فناوری‌های نوین آموزشی و محاسبات مداری" />
    <meta property="og:title" content="Orbital Celestial EdTech | اوربیتال" />
    <meta property="og:description" content="پلتفرم آموزشی و رصدخانه دیجیتال اوربیتال؛ تلاقی دانش نجوم باستانی با فناوری‌های نوین آموزشی و محاسبات مداری" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="assets/images/celestial-scholar.jpg" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Google Fonts: Vazirmatn, Plus Jakarta Sans, Space Grotesk -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&family=Vazirmatn:wght@400;600;700;800;900&display=swap" rel="stylesheet">

    <!-- Pure Vanilla Stylesheet -->
    <link rel="stylesheet" href="./assets/css/style.css" />
	
  </head>
  <body>
    <!-- Starfield Background Canvas -->
    <canvas id="stars-canvas"></canvas>
    <div class="cosmic-ambient-glow"></div>

    <!-- Header with Centered Logo Image -->
    <header class="site-header">
      <div class="header-inner">
        <!-- Brand Logo Image (Centered) -->
        <a href="index.html" class="logo-container" aria-label="اوربیتال">
          <img src="assets/images/logo.png" alt="اوربیتال" class="top-logo-img" />
        </a>
      </div>
    </header>

    <!-- Main Hero Stage -->
    <main class="hero-stage">
      <!-- Orbital Planetary Rings & Frameless Image -->
      <div class="hero-orbital-wrapper">
        <!-- Multi-axis Animated Orbital Rings -->
        <svg class="orbit-rings-svg orbit-rotation-1" viewBox="0 0 700 700" fill="none" xmlns="http://www.w3.org/2000/svg">
          <!-- Ellipse 1: Tilted cyan orbit with bright planetary node -->
          <ellipse cx="350" cy="350" rx="320" ry="200" transform="rotate(-25 350 350)" class="orbit-ring" />
          <circle cx="630" cy="230" r="5" fill="#38bdf8" class="orbit-planet-node" style="color: #38bdf8; filter: drop-shadow(0 0 8px #38bdf8);" />
          <circle cx="70" cy="470" r="3.5" fill="#5ce1e6" class="orbit-planet-node" style="color: #5ce1e6; filter: drop-shadow(0 0 6px #5ce1e6);" />

          <!-- Ellipse 2: Counter-tilted orbit with magenta/purple node -->
          <ellipse cx="350" cy="350" rx="300" ry="230" transform="rotate(35 350 350)" class="orbit-ring accent-ring" />
          <circle cx="580" cy="480" r="4.5" fill="#c084fc" class="orbit-planet-node" style="color: #c084fc; filter: drop-shadow(0 0 8px #c084fc);" />
          <circle cx="120" cy="220" r="3" fill="#ffffff" class="orbit-planet-node" style="color: #ffffff; filter: drop-shadow(0 0 5px #ffffff);" />

          <!-- Ellipse 3: Center orbit with cyan node -->
          <ellipse cx="350" cy="350" rx="340" ry="160" transform="rotate(5 350 350)" class="orbit-ring" stroke-opacity="0.12" />
          <circle cx="350" cy="190" r="4" fill="#38bdf8" class="orbit-planet-node" style="color: #38bdf8; filter: drop-shadow(0 0 7px #38bdf8);" />
        </svg>

        <!-- Frameless Image with Reaction & Animation -->
        <div class="frameless-image-wrapper idle-floating" id="celestial-card">
          <img src="assets/images/orbit.png" alt="سفیر دانش کیهانی اوربیتال" loading="eager" />
          <div class="optical-sheen"></div>
        </div>
      </div>

      <!-- Headline -->
      <h1 class="hero-headline">اتفاق تازه‌ای در راه است.</h1>

      <!-- 3D Interactive CTA Button -->
      <button class="btn-orbital-cta btn-3d-idle" id="cta-btn" type="button" aria-label="ارتباط با تیم اوربیتال">
        <span class="cta-3d-glow"></span>
        <span class="cta-arrow">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
          </svg>
        </span>
        <span class="cta-text">ارتباط با تیم اوربیتال</span>
      </button>
    </main>

    <!-- Interactive Direct Contact Modal -->
    <div class="orbital-modal-overlay" id="contact-modal">
      <div class="orbital-modal">
        <button class="modal-close-btn" id="modal-close" aria-label="بستن">✕</button>
        <h3 class="modal-title">ارتباط با تیم اوربیتال</h3>
        <p class="modal-desc">
          برای همکاری در پروژه‌های آموزشی، پژوهشی و دریافت نسخه دسترسی زودهنگام، اطلاعات خود را ثبت نمایید.
        </p>
        <form id="quick-contact-form">
          <input type="text" id="user-name" name="name" class="modal-input" placeholder="نام و نام خانوادگی..." required />
          <input type="tel" id="user-phone" name="phone" class="modal-input" placeholder="شماره تماس (مثال: ۰۹۱۲۳۴۵۶۷۸۹)..." required />
          <input type="email" id="user-email" name="email" class="modal-input" placeholder="آدرس ایمیل..." required />
          <textarea id="user-msg" name="message" class="modal-input" rows="3" placeholder="متن پیام (اختیاری)..." style="resize: none;"></textarea>
          <button type="submit" id="submit-btn" class="btn-orbital-cta" style="width: 100%; justify-content: center; margin-bottom: 1.25rem;">
            <span class="cta-text" id="submit-btn-text">ارسال پیام</span>
          </button>
        </form>

        <!-- Direct Telegram Bot Link -->
        <div style="border-top: 1px solid rgba(148, 163, 184, 0.15); padding-top: 1rem; text-align: center;">
          <a href="https://t.me/orbital_qa_bot" target="_blank" rel="noopener noreferrer" style="display: inline-flex; align-items: center; justify-content: center; gap: 0.6rem; color: #5ce1e6; text-decoration: none; font-size: 0.9rem; font-weight: 600; padding: 0.5rem 1rem; border-radius: var(--radius-full); background: rgba(56, 189, 248, 0.08); border: 1px solid rgba(56, 189, 248, 0.2); transition: var(--transition-smooth);" onmouseover="this.style.background='rgba(56, 189, 248, 0.18)'; this.style.borderColor='rgba(56, 189, 248, 0.45)'" onmouseout="this.style.background='rgba(56, 189, 248, 0.08)'; this.style.borderColor='rgba(56, 189, 248, 0.2)'">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
              <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 6.8c-.15 1.58-.8 5.42-1.13 7.19-.14.75-.42 1-.68 1.03-.58.05-1.02-.38-1.58-.75-.88-.58-1.38-.94-2.23-1.5-.99-.65-.35-1.01.22-1.59.15-.15 2.71-2.48 2.76-2.69a.2.2 0 0 0-.05-.18c-.06-.05-.14-.03-.21-.02-.09.02-1.49.95-4.22 2.79-.4.27-.76.41-1.08.4-.36-.01-1.04-.2-1.55-.37-.63-.2-1.12-.31-1.08-.66.02-.18.27-.36.74-.55 2.92-1.27 4.86-2.11 5.83-2.51 2.78-1.16 3.35-1.36 3.73-1.36.08 0 .27.02.39.12.1.08.13.19.14.27-.01.06.01.24 0 .38z"/>
            </svg>
            <span>ربات تلگرام اوربیتال: <span style="direction: ltr; display: inline-block; font-family: var(--font-mono);">@orbital_qa_bot</span></span>
          </a>
        </div>
      </div>
    </div>

    <!-- Toast Notification -->
    <div class="orbital-toast" id="toast-notify">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
        <polyline points="22 4 12 14.01 9 11.01"></polyline>
      </svg>
      <span id="toast-msg">پیام شما با موفقیت در مدار ثبت شد.</span>
    </div>

    <!-- Vanilla JavaScript -->
    <script src="assets/js/main.js"></script>
  </body>
</html>
